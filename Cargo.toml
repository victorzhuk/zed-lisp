[package]
name = "zed_common_lisp"
version = "0.5.2"
edition = "2021"

[lib]
path = "src/common_lisp.rs"
# The rlib target lets integration tests link the build-script parser
# archives; Zed only consumes the cdylib output.
crate-type = ["cdylib", "rlib"]

[dependencies]
zed_extension_api = "0.7.0"
# Verified-release resolution (migrate-to-llsp): SHA-256 over the downloaded
# archive and extraction from digest-verified bytes only, per the recorded
# feasibility route.
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
serde_json = "1"
tempfile = "3"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-language = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
